name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - name: Verify source and prepare release notes
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/prepare-release.mjs
      - if: steps.release.outputs.publish == 'true'
        run: npm ci --no-audit --no-fund
      - if: steps.release.outputs.publish == 'true'
        run: npm run build
      - name: Package static site
        if: steps.release.outputs.publish == 'true'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          cp release/build-info.json dist/build-info.json
          archive="LLM-Writer-${RELEASE_TAG}-dist.zip"
          (cd dist && zip -qr "../release/$archive" .)
          (cd release && sha256sum "$archive" > SHA256SUMS.txt)
      - name: Publish validated revision
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$RELEASE_SHA"
          gh release create "$RELEASE_TAG" \
            "release/LLM-Writer-${RELEASE_TAG}-dist.zip" \
            release/SHA256SUMS.txt release/build-info.json \
            --repo "$GITHUB_REPOSITORY" --target "$RELEASE_SHA" \
            --title "$RELEASE_TAG" --notes-file release/notes.md
