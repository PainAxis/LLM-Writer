name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  memory-capacity:
    name: ci-memory-capacity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      # Frozen hydration experiment: both production endpoints are pinned.
      # Current-engine correctness is checked by the other jobs; cold indexing has its own pair.
      # This optimization's frozen comparison contract: docs/memory-capacity.md.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 760042683405760428688d1a7d7f0346e2ff77d3
          path: .capacity-baseline
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 7739cb0f6d020e4e05d0bff8d9d18f59f3d903c0
          path: .capacity-hydration
          persist-credentials: false
      - name: Measure committed reads in ABBA order
        run: |
          node scripts/benchmark-memory-source.mjs --source-root=.capacity-baseline --profile=all --label=baseline-a --output=artifacts/memory-capacity/paired
          node scripts/benchmark-memory-source.mjs --source-root=.capacity-hydration --profile=all --label=candidate-a --output=artifacts/memory-capacity/paired
          node scripts/benchmark-memory-source.mjs --source-root=.capacity-hydration --profile=all --label=candidate-b --output=artifacts/memory-capacity/paired
          node scripts/benchmark-memory-source.mjs --source-root=.capacity-baseline --profile=all --label=baseline-b --output=artifacts/memory-capacity/paired
      - name: Verify equivalent evidence and read accounting
        run: >-
          node scripts/compare-memory-source.mjs
          --baseline=artifacts/memory-capacity/paired/baseline-a-all.json
          --baseline=artifacts/memory-capacity/paired/baseline-b-all.json
          --candidate=artifacts/memory-capacity/paired/candidate-a-all.json
          --candidate=artifacts/memory-capacity/paired/candidate-b-all.json
          --baseline-commit=760042683405760428688d1a7d7f0346e2ff77d3
          --order=ABBA --output=artifacts/memory-capacity/comparison.json
      - name: Upload memory capacity measurements
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: memory-capacity-evidence-${{ github.run_attempt }}
          path: artifacts/memory-capacity
          if-no-files-found: warn
          retention-days: 7

  memory-cold-index:
    name: ci-memory-cold-index
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 7739cb0f6d020e4e05d0bff8d9d18f59f3d903c0
          path: .cold-index-baseline
          persist-credentials: false
      # Historical cold-index experiment: freeze both endpoints, as for hydration above.
      # Current-engine scope/semantics are exercised by smoke, stress and full-scan jobs.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ed83bfef9903e8870ecf8b2b7ff2f47da6d2b5fc
          path: .cold-index-candidate
          persist-credentials: false
      - name: Measure cold and new-instance builds with identical retrieval in ABBA order
        run: |
          for profile in million ten-million; do
            node --expose-gc --import tsx scripts/benchmark-memory-capacity.ts --engine-root=.cold-index-baseline --profile=$profile --label=baseline-a --output=artifacts/memory-cold-index
            node --expose-gc --import tsx scripts/benchmark-memory-capacity.ts --engine-root=.cold-index-candidate --profile=$profile --label=candidate-a --output=artifacts/memory-cold-index
            node --expose-gc --import tsx scripts/benchmark-memory-capacity.ts --engine-root=.cold-index-candidate --profile=$profile --label=candidate-b --output=artifacts/memory-cold-index
            node --expose-gc --import tsx scripts/benchmark-memory-capacity.ts --engine-root=.cold-index-baseline --profile=$profile --label=baseline-b --output=artifacts/memory-cold-index
            node scripts/compare-memory-cold-index.mjs --baseline=artifacts/memory-cold-index/baseline-a-$profile.json --baseline=artifacts/memory-cold-index/baseline-b-$profile.json --candidate=artifacts/memory-cold-index/candidate-a-$profile.json --candidate=artifacts/memory-cold-index/candidate-b-$profile.json --output=artifacts/memory-cold-index/comparison-$profile.json
          done
      - name: Upload cold index measurements
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: memory-cold-index-evidence-${{ github.run_attempt }}
          path: artifacts/memory-cold-index
          if-no-files-found: warn
          retention-days: 7

  memory-full-scan:
    name: ci-memory-full-scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Measure production full-range scans and real adapter parsing
        run: |
          for dimensions in 128 512 4096; do
            npm run test:memory-full-scan-capacity -- --dimensions=$dimensions --rounds=3
          done
      - run: npm run test:browser-memory-full-scan
      - name: Upload full-range scan measurements and browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: memory-full-scan-evidence-${{ github.run_attempt }}
          path: |
            artifacts/memory-full-scan
            artifacts/browser-memory-full-scan
          if-no-files-found: warn
          retention-days: 7

  memory-support:
    name: ci-memory-support
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      # The default code-evidence evaluation is fully mocked. CI never uses --live or credentials.
      - name: Record mocked code-evidence integration
        run: |
          mkdir -p artifacts/memory-support-code
          npm run --silent smoke:memory-support-code > artifacts/memory-support-code/report.json
      - run: npm run test:browser-memory-support
        timeout-minutes: 6
      - name: Upload cited-support protocol and browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: memory-support-evidence-${{ github.run_attempt }}
          path: |
            artifacts/memory-support-code
            artifacts/browser-memory-support
          if-no-files-found: warn
          retention-days: 7

  memory-stress:
    name: ci-memory-stress
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test:memory-stress-local
      - run: npm run test:memory-stress-hybrid
      - name: Upload memory stress evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: memory-stress-evidence-${{ github.run_attempt }}
          path: artifacts/memory-stress/*.json
          if-no-files-found: warn
          retention-days: 7

  memory-browser-stress:
    name: ci-memory-browser-stress
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:browser-memory-stress
      - name: Upload browser memory stress evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: memory-browser-stress-evidence-${{ github.run_attempt }}
          path: artifacts/browser-memory-stress
          if-no-files-found: warn
          retention-days: 7

  graph-backup-mobile:
    name: ci-graph-backup-mobile
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run build
        id: build
      - run: npm run test:browser-graph-backup
        timeout-minutes: 4
      - run: npm run test:browser-mobile
        timeout-minutes: 4
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      - name: Upload graph backup and mobile evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: graph-backup-mobile-evidence-${{ github.run_attempt }}
          path: |
            artifacts/browser-graph-backup
            artifacts/browser-mobile
          if-no-files-found: warn
          retention-days: 7

  writer-memory:
    name: ci-writer-memory
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
        id: install
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:browser-writer-memory
      - name: Upload Writer browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: writer-memory-browser-evidence-${{ github.run_attempt }}
          path: artifacts/browser-writer-memory
          if-no-files-found: warn
          retention-days: 7
      - run: npm run test:writer-memory-stress
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      - name: Upload Writer memory stress evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: writer-memory-stress-evidence-${{ github.run_attempt }}
          path: artifacts/writer-memory-stress
          if-no-files-found: warn
          retention-days: 7

  quality:
    name: ci-quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint -- --max-warnings=0
      - run: npm run build
      - run: npm run smoke:all

  browser:
    name: ci-browser
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:browser-memory
      - run: npm run test:browser-memory-hybrid
      - run: npm run test:browser-memory-fact-graph
      - name: Upload fact graph review evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fact-graph-review-${{ github.run_attempt }}
          path: |
            artifacts/browser-memory-fact-graph/*.json
            artifacts/browser-memory-fact-graph/*.png
          if-no-files-found: warn
          retention-days: 7
      - run: npm run test:browser-extensions
      - run: npm run test:browser
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-evidence-${{ github.run_attempt }}
          path: |
            artifacts/browser
            artifacts/browser-extensions
            artifacts/browser-memory
            artifacts/browser-memory-hybrid
            artifacts/browser-memory-fact-graph
          if-no-files-found: warn
          retention-days: 7
