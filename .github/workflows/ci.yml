name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  memory-stress:
    name: ci-memory-stress
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test:memory-stress-local
      - run: npm run test:memory-stress-hybrid
      - name: Upload memory stress evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: memory-stress-evidence-${{ github.run_attempt }}
          path: artifacts/memory-stress/*.json
          if-no-files-found: warn
          retention-days: 7

  memory-browser-stress:
    name: ci-memory-browser-stress
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:browser-memory-stress
      - name: Upload browser memory stress evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: memory-browser-stress-evidence-${{ github.run_attempt }}
          path: artifacts/browser-memory-stress
          if-no-files-found: warn
          retention-days: 7

  graph-backup-mobile:
    name: ci-graph-backup-mobile
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run build
        id: build
      - run: npm run test:browser-graph-backup
      - run: npm run test:browser-mobile
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      - name: Upload graph backup and mobile evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: graph-backup-mobile-evidence-${{ github.run_attempt }}
          path: |
            artifacts/browser-graph-backup
            artifacts/browser-mobile
          if-no-files-found: warn
          retention-days: 7

  quality:
    name: ci-quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint -- --max-warnings=0
      - run: npm run build
      - run: npm run smoke:all

  browser:
    name: ci-browser
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:browser-memory
      - run: npm run test:browser-memory-hybrid
      - run: npm run test:browser-memory-fact-graph
      - name: Upload fact graph review evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fact-graph-review-${{ github.run_attempt }}
          path: |
            artifacts/browser-memory-fact-graph/*.json
            artifacts/browser-memory-fact-graph/*.png
          if-no-files-found: warn
          retention-days: 7
      - run: npm run test:browser-extensions
      - run: npm run test:browser
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-evidence-${{ github.run_attempt }}
          path: |
            artifacts/browser
            artifacts/browser-extensions
            artifacts/browser-memory
            artifacts/browser-memory-hybrid
            artifacts/browser-memory-fact-graph
          if-no-files-found: warn
          retention-days: 7
