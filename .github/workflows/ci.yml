name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Only the separate bounded archive step may populate artifact upload directories.
# Raw reports, backups, traces and full export payloads remain runner-local (ephemeral).
# A failed test still fails its job; derived evidence never substitutes for test success.
jobs:
  memory-capacity:
    name: ci-memory-capacity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      # Frozen hydration experiment: both production endpoints are pinned.
      # Current-engine correctness is checked by the other jobs; cold indexing has its own pair.
      # This optimization's frozen comparison contract: docs/memory-capacity.md.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 760042683405760428688d1a7d7f0346e2ff77d3
          path: .capacity-baseline
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 7739cb0f6d020e4e05d0bff8d9d18f59f3d903c0
          path: .capacity-hydration
          persist-credentials: false
      - name: Measure committed reads in ABBA order
        run: |
          node scripts/benchmark-memory-source.mjs --source-root=.capacity-baseline --profile=all --label=baseline-a --output=artifacts/memory-capacity/paired
          node scripts/benchmark-memory-source.mjs --source-root=.capacity-hydration --profile=all --label=candidate-a --output=artifacts/memory-capacity/paired
          node scripts/benchmark-memory-source.mjs --source-root=.capacity-hydration --profile=all --label=candidate-b --output=artifacts/memory-capacity/paired
          node scripts/benchmark-memory-source.mjs --source-root=.capacity-baseline --profile=all --label=baseline-b --output=artifacts/memory-capacity/paired
      - name: Verify equivalent evidence and read accounting
        run: >-
          node scripts/compare-memory-source.mjs
          --baseline=artifacts/memory-capacity/paired/baseline-a-all.json
          --baseline=artifacts/memory-capacity/paired/baseline-b-all.json
          --candidate=artifacts/memory-capacity/paired/candidate-a-all.json
          --candidate=artifacts/memory-capacity/paired/candidate-b-all.json
          --baseline-commit=760042683405760428688d1a7d7f0346e2ff77d3
          --order=ABBA --output=artifacts/memory-capacity/comparison.json
      - name: Prepare bounded memory-capacity evidence
        id: archive_memory_capacity
        if: ${{ !cancelled() }}
        run: node scripts/prepare-ci-evidence.mjs --group=memory-capacity
      - name: Upload memory capacity measurements
        if: ${{ !cancelled() && steps.archive_memory_capacity.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: memory-capacity-evidence-${{ github.run_attempt }}
          path: artifacts/ci-evidence/memory-capacity
          if-no-files-found: error
          retention-days: 7

  memory-cold-index:
    name: ci-memory-cold-index
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 7739cb0f6d020e4e05d0bff8d9d18f59f3d903c0
          path: .cold-index-baseline
          persist-credentials: false
      # Historical cold-index experiment: freeze both endpoints, as for hydration above.
      # Current-engine scope/semantics are exercised by smoke, stress and full-scan jobs.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ed83bfef9903e8870ecf8b2b7ff2f47da6d2b5fc
          path: .cold-index-candidate
          persist-credentials: false
      - name: Measure cold and new-instance builds with identical retrieval in ABBA order
        run: |
          for profile in million ten-million; do
            node --expose-gc --import tsx scripts/benchmark-memory-capacity.ts --engine-root=.cold-index-baseline --profile=$profile --label=baseline-a --output=artifacts/memory-cold-index
            node --expose-gc --import tsx scripts/benchmark-memory-capacity.ts --engine-root=.cold-index-candidate --profile=$profile --label=candidate-a --output=artifacts/memory-cold-index
            node --expose-gc --import tsx scripts/benchmark-memory-capacity.ts --engine-root=.cold-index-candidate --profile=$profile --label=candidate-b --output=artifacts/memory-cold-index
            node --expose-gc --import tsx scripts/benchmark-memory-capacity.ts --engine-root=.cold-index-baseline --profile=$profile --label=baseline-b --output=artifacts/memory-cold-index
            node scripts/compare-memory-cold-index.mjs --baseline=artifacts/memory-cold-index/baseline-a-$profile.json --baseline=artifacts/memory-cold-index/baseline-b-$profile.json --candidate=artifacts/memory-cold-index/candidate-a-$profile.json --candidate=artifacts/memory-cold-index/candidate-b-$profile.json --output=artifacts/memory-cold-index/comparison-$profile.json
          done
      - name: Prepare bounded memory-cold-index evidence
        id: archive_memory_cold_index
        if: ${{ !cancelled() }}
        run: node scripts/prepare-ci-evidence.mjs --group=memory-cold-index
      - name: Upload cold index measurements
        if: ${{ !cancelled() && steps.archive_memory_cold_index.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: memory-cold-index-evidence-${{ github.run_attempt }}
          path: artifacts/ci-evidence/memory-cold-index
          if-no-files-found: error
          retention-days: 7

  memory-full-scan:
    name: ci-memory-full-scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Measure production full-range scans and real adapter parsing
        run: |
          for dimensions in 128 512 4096; do
            npm run test:memory-full-scan-capacity -- --dimensions=$dimensions --rounds=3
          done
      - run: npm run test:browser-memory-full-scan
      - name: Prepare bounded memory-full-scan evidence
        id: archive_memory_full_scan
        if: ${{ !cancelled() }}
        run: node scripts/prepare-ci-evidence.mjs --group=memory-full-scan
      - name: Upload full-range scan measurements and browser evidence
        if: ${{ !cancelled() && steps.archive_memory_full_scan.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: memory-full-scan-evidence-${{ github.run_attempt }}
          path: artifacts/ci-evidence/memory-full-scan
          if-no-files-found: error
          retention-days: 7

  memory-support:
    name: ci-memory-support
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      # The default code-evidence evaluation is fully mocked. CI never uses --live or credentials.
      - name: Record mocked code-evidence integration
        run: |
          mkdir -p artifacts/memory-support-code
          npm run --silent smoke:memory-support-code > artifacts/memory-support-code/report.json
      - run: npm run test:browser-memory-support
        timeout-minutes: 6
      - name: Prepare bounded memory-support evidence
        id: archive_memory_support
        if: ${{ !cancelled() }}
        run: node scripts/prepare-ci-evidence.mjs --group=memory-support
      - name: Upload cited-support protocol and browser evidence
        if: ${{ !cancelled() && steps.archive_memory_support.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: memory-support-evidence-${{ github.run_attempt }}
          path: artifacts/ci-evidence/memory-support
          if-no-files-found: error
          retention-days: 7

  memory-novel-scan:
    name: ci-memory-novel-scan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      # All requests are deterministic local fixtures; no model credentials or live providers.
      - run: npm run test:browser-memory-novel-scan
        timeout-minutes: 12
      - name: Prepare bounded memory-novel-scan evidence
        id: archive_memory_novel_scan
        if: ${{ !cancelled() }}
        run: node scripts/prepare-ci-evidence.mjs --group=memory-novel-scan
      - name: Upload whole-disclosed-source candidate scan evidence
        if: ${{ !cancelled() && steps.archive_memory_novel_scan.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: memory-novel-scan-evidence-${{ github.run_attempt }}
          path: artifacts/ci-evidence/memory-novel-scan
          if-no-files-found: error
          retention-days: 7

  memory-stress:
    name: ci-memory-stress
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test:memory-stress-local
      - run: npm run test:memory-stress-hybrid
      - name: Prepare bounded memory-stress evidence
        id: archive_memory_stress
        if: ${{ !cancelled() }}
        run: node scripts/prepare-ci-evidence.mjs --group=memory-stress
      - name: Upload memory stress evidence
        if: ${{ !cancelled() && steps.archive_memory_stress.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: memory-stress-evidence-${{ github.run_attempt }}
          path: artifacts/ci-evidence/memory-stress
          if-no-files-found: error
          retention-days: 7

  memory-browser-stress:
    name: ci-memory-browser-stress
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:browser-memory-stress
      - name: Prepare bounded memory-browser-stress evidence
        id: archive_memory_browser_stress
        if: ${{ !cancelled() }}
        run: node scripts/prepare-ci-evidence.mjs --group=memory-browser-stress
      - name: Upload browser memory stress evidence
        if: ${{ !cancelled() && steps.archive_memory_browser_stress.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: memory-browser-stress-evidence-${{ github.run_attempt }}
          path: artifacts/ci-evidence/memory-browser-stress
          if-no-files-found: error
          retention-days: 7

  graph-backup-mobile:
    name: ci-graph-backup-mobile
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run build
        id: build
      - run: npm run test:browser-graph-backup
        timeout-minutes: 4
      - run: npm run test:browser-mobile
        timeout-minutes: 4
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      - name: Prepare bounded graph-backup-mobile evidence
        id: archive_graph_backup_mobile
        if: ${{ !cancelled() }}
        run: node scripts/prepare-ci-evidence.mjs --group=graph-backup-mobile
      - name: Upload graph backup and mobile evidence
        if: ${{ !cancelled() && steps.archive_graph_backup_mobile.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: graph-backup-mobile-evidence-${{ github.run_attempt }}
          path: artifacts/ci-evidence/graph-backup-mobile
          if-no-files-found: error
          retention-days: 7

  writer-memory:
    name: ci-writer-memory
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
        id: install
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:browser-writer-memory
      - name: Prepare bounded writer-memory-browser evidence
        id: archive_writer_memory_browser
        if: ${{ !cancelled() }}
        run: node scripts/prepare-ci-evidence.mjs --group=writer-memory-browser
      - name: Upload Writer browser evidence
        if: ${{ !cancelled() && steps.archive_writer_memory_browser.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: writer-memory-browser-evidence-${{ github.run_attempt }}
          path: artifacts/ci-evidence/writer-memory-browser
          if-no-files-found: error
          retention-days: 7

      - run: npm run test:writer-memory-stress
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      - name: Prepare bounded writer-memory-stress evidence
        id: archive_writer_memory_stress
        if: ${{ !cancelled() }}
        run: node scripts/prepare-ci-evidence.mjs --group=writer-memory-stress
      - name: Upload Writer memory stress evidence
        if: ${{ !cancelled() && steps.archive_writer_memory_stress.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: writer-memory-stress-evidence-${{ github.run_attempt }}
          path: artifacts/ci-evidence/writer-memory-stress
          if-no-files-found: error
          retention-days: 7

  quality:
    name: ci-quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint -- --max-warnings=0
      - run: npm run build
      - run: npm run smoke:all

  browser:
    name: ci-browser
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:browser-memory
      - run: npm run test:browser-memory-hybrid
      - run: npm run test:browser-memory-fact-graph
      - name: Prepare bounded fact-graph-review evidence
        id: archive_fact_graph_review
        if: ${{ !cancelled() }}
        run: node scripts/prepare-ci-evidence.mjs --group=fact-graph-review
      - name: Upload fact graph review evidence
        if: ${{ !cancelled() && steps.archive_fact_graph_review.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fact-graph-review-${{ github.run_attempt }}
          path: artifacts/ci-evidence/fact-graph-review
          if-no-files-found: error
          retention-days: 7

      - run: npm run test:browser-extensions
      - run: npm run test:browser
      - name: Prepare bounded browser evidence
        id: archive_browser
        if: ${{ !cancelled() }}
        run: node scripts/prepare-ci-evidence.mjs --group=browser
      - name: Upload browser evidence
        if: ${{ !cancelled() && steps.archive_browser.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-evidence-${{ github.run_attempt }}
          path: artifacts/ci-evidence/browser
          if-no-files-found: error
          retention-days: 7

  writer-agent:
    name: ci-writer-agent
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      # Ninety isolated scenarios include genuine multi-tab saves and long profiles.
      # The first-run observation budget is not a measured timing/quality claim.
      # Controlled local HTTP only: never discover credentials or call a live provider.
      # Kept out of test:browser to avoid duplicate execution, like the two stage-three jobs.
      - name: Verify the bounded author-reviewed Agent in the production build
        run: npm run test:browser-writer-agent
        timeout-minutes: 20
      - name: Prepare bounded writer-agent evidence
        id: archive_writer_agent
        if: ${{ !cancelled() }}
        run: node scripts/prepare-ci-evidence.mjs --group=writer-agent
      - name: Upload bounded Agent review evidence only
        if: ${{ !cancelled() && steps.archive_writer_agent.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: writer-agent-evidence-${{ github.run_attempt }}
          path: artifacts/ci-evidence/writer-agent
          if-no-files-found: error
          retention-days: 7

      # Production restart checks plus a separately labelled offline-host fault build.
      # No credentials, traces, screenshots, complete store dumps or request collections.
      - name: Verify the isolated Campaign durability foundation
        if: ${{ !cancelled() }}
        run: npm run test:browser-writer-campaign
        timeout-minutes: 8
      - name: Prepare closed Campaign evidence
        id: archive_writer_campaign
        if: ${{ !cancelled() }}
        run: node scripts/prepare-ci-evidence.mjs --group=writer-campaign
      - name: Upload source-free Campaign summary only
        if: ${{ !cancelled() && steps.archive_writer_campaign.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: writer-campaign-evidence-${{ github.run_attempt }}
          path: artifacts/ci-evidence/writer-campaign
          if-no-files-found: error
          retention-days: 7
