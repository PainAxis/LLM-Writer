name: Jina browser compatibility

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/jina-browser.yml
      - scripts/browser-jina-discovery.mjs

permissions:
  contents: read

concurrency:
  group: jina-browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  public-discovery:
    name: jina-public-browser-discovery
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      # Public discovery only. No account key, paid tool call, or LLM request.
      - run: node scripts/browser-jina-discovery.mjs
